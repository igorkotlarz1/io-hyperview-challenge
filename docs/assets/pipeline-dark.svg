<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Pipeline: patch, mask-aware smoothing, features, per-target selection, model">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0f1a14"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="330" rx="18"/></clipPath></defs>
  <g clip-path="url(#frame)"><rect width="1200" height="330" fill="url(#bg)"/></g>
  <g font-family="'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="52" y="54" font-size="20" font-weight="700" fill="#e6edf3">From a data cube to four numbers</text>
    <text x="1148" y="54" font-size="13" fill="#8b93a7" text-anchor="end">everything that learns is fitted inside the folds</text>
    <rect x="52" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#2dd4bf" stroke-width="1.5"/><rect x="52" y="92" width="184" height="36" rx="14" fill="#2dd4bf" opacity="0.16"/><text x="70" y="116" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="2">01 PATCH</text><text x="70" y="160" font-size="14" fill="#e6edf3">150 × H × W cube</text><text x="70" y="192" font-size="14" fill="#e6edf3">field mask</text><text x="70" y="224" font-size="14" fill="#e6edf3">1,732 train</text><text x="70" y="256" font-size="14" fill="#e6edf3">1,154 test</text><line x1="240" y1="190.0" x2="276" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="276,185.0 282,190.0 276,195.0" fill="#8b93a7"/><rect x="280" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#f0a35e" stroke-width="1.5"/><rect x="280" y="92" width="184" height="36" rx="14" fill="#f0a35e" opacity="0.16"/><text x="298" y="116" font-size="13" font-weight="700" fill="#f0a35e" letter-spacing="2">02 SMOOTH</text><text x="298" y="160" font-size="14" fill="#e6edf3">Gaussian σ = 2 px</text><text x="298" y="192" font-size="14" fill="#e6edf3">mask-aware</text><text x="298" y="224" font-size="14" fill="#e6edf3">(normalized conv.)</text><text x="298" y="256" font-size="14" fill="#e6edf3">bands untouched</text><line x1="468" y1="190.0" x2="504" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="504,185.0 510,190.0 504,195.0" fill="#8b93a7"/><rect x="508" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#a3e635" stroke-width="1.5"/><rect x="508" y="92" width="184" height="36" rx="14" fill="#a3e635" opacity="0.16"/><text x="526" y="116" font-size="13" font-weight="700" fill="#a3e635" letter-spacing="2">03 FEATURES</text><text x="526" y="160" font-size="14" fill="#e6edf3">mean spectrum</text><text x="526" y="192" font-size="14" fill="#e6edf3">SG d1 · d2 · d3</text><text x="526" y="224" font-size="14" fill="#e6edf3">per-band std</text><text x="526" y="256" font-size="14" fill="#e6edf3">field size → 752</text><line x1="696" y1="190.0" x2="732" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="732,185.0 738,190.0 732,195.0" fill="#8b93a7"/><rect x="736" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#c084fc" stroke-width="1.5"/><rect x="736" y="92" width="184" height="36" rx="14" fill="#c084fc" opacity="0.16"/><text x="754" y="116" font-size="13" font-weight="700" fill="#c084fc" letter-spacing="2">04 SELECT</text><text x="754" y="160" font-size="14" fill="#e6edf3">per target</text><text x="754" y="192" font-size="14" fill="#e6edf3">top-50 importance</text><text x="754" y="224" font-size="14" fill="#e6edf3">or RFE</text><text x="754" y="256" font-size="14" fill="#e6edf3">inside every fold</text><line x1="924" y1="190.0" x2="960" y2="190.0" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></line><polygon points="960,185.0 966,190.0 960,195.0" fill="#8b93a7"/><rect x="964" y="92" width="184" height="196" rx="14" fill="#0d1424" stroke="#60a5fa" stroke-width="1.5"/><rect x="964" y="92" width="184" height="36" rx="14" fill="#60a5fa" opacity="0.16"/><text x="982" y="116" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="2">05 MODEL</text><text x="982" y="160" font-size="14" fill="#e6edf3">RF / XGBoost</text><text x="982" y="192" font-size="14" fill="#e6edf3">tuned on MSE</text><text x="982" y="224" font-size="14" fill="#e6edf3">3 × 5-fold CV</text><text x="982" y="256" font-size="14" fill="#e6edf3">→ submission</text>
  </g>
  <rect width="1200" height="330" rx="18" fill="none" stroke="#1f2a3d"/>
</svg>
